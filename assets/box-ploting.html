<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Ploting</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            text-align: center;
            /* height: 10vh; */
            margin: 1%;
        }
        .con{
            height: 90vh;
            width: 80%;
            /* border: 1px solid black; */
            background: teal;
            margin: auto;
            display: flex;align-items: center;
            justify-content: center;
            /* position: relative; */

        }
        .box{
            height: 80%;
            width: 80%;
            background: skyblue;
            position: relative;
        }
        .b1{
            height: 80%;
            width: 80%;
            background: blue;
            border: 40px solid navy;
            margin: 60px 90px;
            padding: 80px 80px 80px 130px;
            position: relative;
            
        }
        .b2{
            height: 100%;
            width: 90%;
            background: orange;
            display: flex;align-items: center;justify-content: center;
            position: relative;
        }
        .m{
            position: absolute;
            display: block;
            padding: 30px 90px;
            /* left: 48.8%; */
            /* transform: translate(-50%, 50%); */
        }
        .b{
            color: white;
            position: absolute;
            display: block;
            top: -8%;

            /* left: 50%; */
            /* transform: translate(-50%, 50%); */
        }
        .p{
            color: white;
            position: absolute;
            display: block;
            top: 5%;
            padding: 1px 140px;
            /* left: 50%; */
            /* transform: translate(-50%, 50%); */
        }
        @media (max-width:860px){
            .b1{
                padding: 50px 30px 50px 60px;
                margin: 55px;
            }
            .m{
                padding: 30px 60px;
            }
            .p{
                padding: 1px 90px;
            }
        }
        @media (max-width:560px) {
            h1{
                padding-top: 30px;
            }
            .con{
                height: 70vh;
                width: 90%;
                margin-top: 15%;
            }
            .b1{
                padding: 35px 30px 30px 50px;
                margin: 40px;
            }

            .m{
                padding: 15px 70px;
            }
            .b{
                top: -10%;
            }
            .p{
                padding: 1px 33px;
            }
        } 
    </style>
</head>
<body>
    <h1>Box-Ploting</h1>
    <div class="con">
        <div class="box"><div class="m">Margin</div>
            <div class="b1"><div class="b">Border</div><div class="p">Padding</div>
                <div class="b2"><h2>Content</h2></div>
            </div>
        </div>
    </div>
</body>
</html>
