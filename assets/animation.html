<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Examples</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: aliceblue;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .con{
            min-height: 100vh;
            width: 100%;
            padding-bottom: 30px;
        }
        h1{
            text-align: center;
            padding: 20px;
        }
        .top{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 70px 20px;
            padding: 60px 20px;
        }
        .box{
            height: 120px;
            width: 120px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box p{
            color: white;
            font-weight: 600;
            text-align: center;
        }
        .b1{
            background-color: red;
            animation: colour 5s infinite linear;
        }
        @keyframes colour{
            0%, 100%{
                background-color: red;
            }
            25%{
                background-color: blue;
            }
            50%{
                background-color: green;
            }
            75%{background-color: orange;
            }
        }
        .b2{
            background-color: purple;
            animation: move 5s infinite linear;
        }
        @keyframes move{
            0%, 100%{
                transform: translate(0,0);
            }
            33%{
                transform: translate(0,50px);
            }
            66%{
                transform: translate(0,-50px);
            }
        }
        .b3{
            background-color: navy;
            animation: rotate 5s infinite linear;
        }
        @keyframes rotate{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        .b4{
            background-color: red;
            animation: pulse 5s infinite linear;
        }
        @keyframes pulse{
            0%, 100%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.3);
            }
        }
        .b5{
            background-color: grey;
            animation: fade 5s infinite linear;
        }
        @keyframes fade{
            0%, 100%{
                opacity: 1;
            }
            50%{
                opacity: .2;
            }
        }
        .b6{
            border: 10px solid #cfd8e3;
            border-top-color: black;
            border-radius: 50%;
            animation: load 5s infinite ease-in-out;
        }
        @keyframes load{
            to{
                transform: rotate(360deg);
            }
        }
        .b6 p{
            color: black;
            animation: rev 5s infinite ease-in-out;
        }
        @keyframes rev{
            to{
                transform: rotate(-360deg);
            }
        }
        .bottom{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 20px;
            padding: 0 20px;
        }
        .left, .right{
            height: 400px;
            width: 45%;
            min-width: 300px;
            border: 1px dashed black;
            display: flex;
            flex-direction: column;
        }
        h2{
            border-bottom: 1px dashed black;
            text-align: center;
            line-height: 2;
        }

        .track{
            position: relative;
            flex: 1;
        }
        .sq{
            --s: 100px;
            position: absolute;
            top: 0;
            left: 0;
            height: var(--s);
            width: var(--s);
            background-color: brown;
            animation: moving 8s infinite;
        }
        @keyframes moving{
            0%, 100%{
                left: 0; top: 0;
            }
            25%{
                left: calc(100% - var(--s));
                top: 0;
            }
            50%{
                left: calc(100% - var(--s));
                top: calc(100% - var(--s));
            }
            75%{
                left: 0;
                top: calc(100% - var(--s));
            }
        }
        .animation{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .google{
            height: clamp(36px, 5vw, 70px);
            width: clamp(36px, 5vw, 70px);
            border-radius: 50%;
            animation: bounce 3s infinite ease-in-out;
        }
        @keyframes bounce{
            0%, 100%{ transform: translateY(0); }
            33%{ transform: translateY(-30px); }
        }
        .g1{
            background-color: orange;
        }
        .g2{
            background-color: yellow;
            animation-delay: .3s;
        }
        .g3{
            background-color: green;
            animation-delay: .6s;
        }
        .g4{
            background-color: blue;
            animation-delay: .9s;
        }
        .g5{
            background-color: red;
            animation-delay: 1.2s;
        }
        @media (max-width: 420px){
            h1{
                font-size: clamp(18px, 6vw, 50px);
            }
            .box{
                height: 100px;
                width: 100px;
            }
            .left, .right{
                width: 90%;
                min-width: 0;
                height: 300px;
            }
            .sq{
                --s: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="con">
        <h1>CSS Animation Examples</h1>
        <div class="top">
            <div class="box b1"><p>Colour</p></div>
            <div class="box b2"><p>Move</p></div>
            <div class="box b3"><p>Rotate</p></div>
            <div class="box b4"><p>Pulse</p></div>
            <div class="box b5"><p>Fade</p></div>
            <div class="box b6"><p>Loading</p></div>
        </div>
        <div class="bottom">
            <div class="left">
                <h2>Square Path Animation</h2>
                <div class="track">
                    <div class="sq"></div>
                </div>
            </div>
            <div class="right">
                <h2>Google Animation</h2>
                <div class="animation">
                    <div class="google g1"></div>
                    <div class="google g2"></div>
                    <div class="google g3"></div>
                    <div class="google g4"></div>
                    <div class="google g5"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
