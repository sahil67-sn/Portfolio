    <style>
        :root {
            --paper: #F4F7FF;
            --white: #FFFFFF;
            --ink:   #0E1B4D;
            --muted: #4A5578;
            --cobalt:#1E40D8;
            --turquoise:#0E9F9A;
            --marigold: #FFB627;
            --display: 'Bricolage Grotesque', system-ui, sans-serif;
            --body: 'Figtree', system-ui, sans-serif;
            --ease: cubic-bezier(.2, .8, .2, 1);
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--body);
            background: var(--paper);
            color: var(--ink);
        }
        header{
            height: 10vh;
            width: 80%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* border: 1px solid black; */
        }
        .menu{
            display:flex;
            align-items:center;
            gap:6px;
        }
        .menu a{
            text-decoration: none;
            padding:9px 18px;
            border-radius:99px;
            font-weight:500;
            font-size:.95rem;
            color: black;
        }
        .menu a:hover{
            background: rgba(185, 174, 174,.2);
        }
        .menu a.active{
            background:navy;
            color:white;
        }
        .hero{
            height:90vh;
            border-top: 1px solid black;
            /* background: beige; */
            /* padding: clamp(48px,8vw,96px); */
            display: flex;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(circle at 1px 1px ,rgba(30,64,216,.18)3px,transparent 0);
            background-size: 28px 28px;

        }
        .left{
            height: 100%;
            width: 50%;
            min-width: 800px;
            /* border: 1px solid black; */
            padding: clamp(0px,8vw,100px);
            padding-left: clamp(0px,9vw,180px);
        }
        .college{
            display: inline-flex;
            gap: 10px;
            background: white;
            /* width: 55%; */
            padding: 15px;
            /* margin: 20px; */
            border-radius: 99px;
            font-size: .9rem;
            font-weight: 600;
            border: 1px solid rgba(14, 27, 77, .5);
        }
        .name{
            max-width: 30%;
            font-family: var(--display);
            font-size: clamp(50px,7vw,150px);
            font-weight: 900;
            line-height: 1.1;
            margin-top: 20px;
        }
        .batch{
            font-family: var(--display); font-weight: 700;
            font-size: clamp(1.3rem, 5vw, 1.8rem); color: var(--cobalt);
            display: inline-block;
            margin: 10px 0 20px;
        }
        .hero .p{
            width: 430px;
            /* width: 75%; */
            /* max-width: 75%; */
            /* min-width: 70%; */
            border: 1px solid black;
            /* margin: 20px 0 30px; */
            color: var(--muted);
            font-size: 1.1rem;
        }
        
        .right{
            height: 100%;
            width: 50%;
            /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .oval{
            height: 80%;
            width: 50%;
            border-radius: 50%;
            border: 2px dashed black;
            position: absolute;
            animation: oval 10s infinite linear;
        }
        @keyframes oval {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .circle{
            height: 30%;
            width: 30%;
            /* aspect-ratio: 1 / 1; */
            border-radius: 50%;
            background: orange;
            position: absolute;
            top: 10%;
            right: 22%;
        }
        .mirror{
            height: 70%;
            width: 45%;
            z-index: 5;
            border-radius: 50% 50% 0 0;
            border: 10px solid white;
            overflow: hidden;
        }
        img{
            display: block;
            max-width: 100%;
        }

        .mirror img{
            display: block;
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .about{
            height: 100vh;
            border: 1px solid black;
        }

            height: 85%;

            margin: 3% auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4%;
            flex-wrap: wrap;
        }
        .card{
            height: 30%;
            width: 30%;
            border: 1px solid black;
            border-radius: 30px 30px 30px 10px;
        }
        .assignments{
            height: 150vh;
            /* background: black; */
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 5%;
            padding: 80px;

        .assignment-card{
            height: 450px;
            max-height: 100%;
            min-height: 200px;
            width: 340px;
            max-width: 100%;
            min-height: 320px;
            border: 1px solid black;

        }
        .top{
            position: relative;
            height: 25%; background-color: blue;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, .3) 0 5px, transparent 6px),
                radial-gradient(circle, rgba(255, 255, 255, .15) 0 9px, transparent 10px);
            background-size: 30px 30px; background-position: 0 0, 15px 15px;
            transition: background-position 1s cubic-bezier(.2, .8, .2, 1);
        }
        .assignment-card:hover .top{
            background-position: 30px 30px, 45px 45px;
        }
        .top:hover{
            transition: ease-in-out .8s;
        }
        .bottom{
            height: 75%;
            border: 1px solid black;
        }
        @media (max-width: 860px) {
  .hero-grid, .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 48px; }
  .about-photo { position: static; }
  .arch-wrap { max-width: 320px; }
  .chip.one { left: -4%; }
  .chip.two { right: -4%; }
}
@media (max-width: 560px) {
  .bar { padding: 8px 14px; }
  .logo span.name { display: none; }
  nav a { padding: 8px 10px; font-size: .88rem; }
  .skills-grid, .assign-grid { grid-template-columns: 1fr; }
  .hero{
    flex-direction: column;
  }
  .left{
    padding:50px 10px 10px 20px;
  }
  .hero .p{
    width: 350px;
