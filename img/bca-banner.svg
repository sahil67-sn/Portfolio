<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" font-family="system-ui, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40D8"/>
      <stop offset=".55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0E9F9A"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#fff" opacity=".22"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFB627" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFB627" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>
  <circle cx="1480" cy="60" r="220" fill="url(#glow)"/>
  <circle cx="260" cy="360" r="170" fill="#fff" opacity=".07"/>
  <circle cx="1500" cy="380" r="120" fill="#fff" opacity=".08"/>

  <!-- code window: centered at x=800 so it stays fully visible when the banner is cropped on mobile -->
  <g transform="translate(565,12)">
    <rect x="8" y="12" width="470" height="236" rx="20" fill="#000" opacity=".25"/>
    <rect width="470" height="236" rx="20" fill="#0B1235"/>
    <path d="M0 20 a20 20 0 0 1 20 -20 h430 a20 20 0 0 1 20 20 v26 h-470 z" fill="#1B2A7A"/>
    <circle cx="30" cy="23" r="8" fill="#FF5F57"/>
    <circle cx="56" cy="23" r="8" fill="#FEBC2E"/>
    <circle cx="82" cy="23" r="8" fill="#28C840"/>
    <text x="235" y="29" text-anchor="middle" font-family="monospace" font-size="18" fill="#C9D3F5">contact.js</text>
    <g font-family="monospace" font-size="22" font-weight="600" xml:space="preserve">
      <text x="26" y="88"><tspan fill="#7AA2FF">role</tspan><tspan fill="#fff">: </tspan><tspan fill="#FFB627">"Web Developer"</tspan></text>
      <text x="26" y="126"><tspan fill="#7AA2FF">city</tspan><tspan fill="#fff">: </tspan><tspan fill="#FFB627">"Ajmer, Rajasthan"</tspan></text>
      <text x="26" y="164"><tspan fill="#7AA2FF">mail</tspan><tspan fill="#fff">: </tspan><tspan fill="#2EE6C5">"sahilhere6767@gmail.com"</tspan></text>
      <text x="26" y="202"><tspan fill="#7AA2FF">note</tspan><tspan fill="#fff">: </tspan><tspan fill="#FFB627">"Let's connect!"</tspan></text>
    </g>
  </g>

  <!-- floating contact icons (right) -->
  <g>
    <circle cx="1315" cy="95" r="48" fill="#FFB627"/>
    <rect x="1288" y="78" width="54" height="38" rx="7" fill="#0E1B4D"/>
    <path d="M1290 82 L1315 103 L1340 82" fill="none" stroke="#FFB627" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="1425" cy="175" r="42" fill="#fff"/>
    <g transform="translate(1425,175) scale(1.9) translate(-12,-12)">
      <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z" fill="#1E40D8"/>
    </g>

    <circle cx="1315" cy="245" r="40" fill="#0E1B4D"/>
    <g transform="translate(1315,245)">
      <path d="M0 -22 a15 15 0 0 1 15 15 c0 11 -15 27 -15 27 s-15 -16 -15 -27 a15 15 0 0 1 15 -15 z" fill="#FFB627"/>
      <circle cx="0" cy="-7" r="6" fill="#0E1B4D"/>
    </g>
  </g>

  <!-- left decoration -->
  <text x="140" y="120" font-family="monospace" font-size="110" font-weight="bold" fill="#fff" opacity=".3">&lt;/&gt;</text>
  <g fill="#FFB627"><circle cx="420" cy="60" r="9"/><circle cx="470" cy="150" r="6"/></g>
</svg>
